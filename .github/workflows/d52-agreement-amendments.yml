name: D52 Agreement Versioning API Regression

on:
  push:
    branches:
      - feat/d52-agreement-amendments
  pull_request:
    paths:
      - "apps/accounts/**"
      - "apps/marketplace/**"
      - "apps/contracts/**"
      - "backend/**"
      - "requirements.txt"
      - ".github/workflows/d52-agreement-amendments.yml"

permissions:
  contents: read

jobs:
  django-agreement-amendments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend apps
      - name: Django system checks
        run: python manage.py check
      - name: Verify migrations match ORM models
        run: python manage.py makemigrations --check --dry-run
      - name: Run D50 + D51 + D52 actual API regression tests
        run: |
          python manage.py test \
            apps.accounts.test_api_d50 \
            apps.contracts.test_contract_flow_d51 \
            apps.contracts.test_agreement_amendments_d52 \
            --verbosity 2
