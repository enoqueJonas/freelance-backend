name: D50 Accounts API Regression

on:
  push:
    branches:
      - qa/d50-accounts-api-regression
  pull_request:
    paths:
      - "apps/accounts/**"
      - "backend/**"
      - "requirements.txt"
      - ".github/workflows/d50-accounts-api.yml"

permissions:
  contents: read

jobs:
  django-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend Python files
        run: python -m compileall -q backend apps
      - name: Django system checks
        run: python manage.py check
      - name: Run REAL Django REST API tests on isolated SQLite test DB
        run: python manage.py test apps.accounts --verbosity 2
