name: D53 API Read Models
on:
  push:
    branches: [feat/d53-ui-api-read-models]
  pull_request:
    paths:
      - "apps/**"
      - "backend/**"
      - ".github/workflows/d53-read-models.yml"
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: |
          python manage.py test \
            apps.accounts.test_api_d50 \
            apps.contracts.test_contract_flow_d51 \
            apps.contracts.test_agreement_amendments_d52 \
            apps.contracts.test_ui_read_models_d53 -v 2
